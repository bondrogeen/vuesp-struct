name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Read package version
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "vuesp-struct@${{ steps.version.outputs.value }}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skip::vuesp-struct@${{ steps.version.outputs.value }} уже на npm — публикация не нужна"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish::Будет опубликована версия ${{ steps.version.outputs.value }}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.check.outputs.published == 'false'
        run: echo "### Опубликован vuesp-struct@${{ steps.version.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
